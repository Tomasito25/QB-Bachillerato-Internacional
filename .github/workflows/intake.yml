# Procesa los envíos: el «servidor» de la aplicación.
#
# Seguridad: el contenido de un issue es entrada hostil. Por eso:
#   - Nunca se interpola en este fichero: tools/actions lo lee del evento y lo trata como datos.
#   - Se ejecuta el código de main, que un issue no puede cambiar.
#   - Se instala con --ignore-scripts.
#
# El cron es un barrido de seguridad: cada ejecución procesa todo lo pendiente, porque la cola
# de concurrencia puede desbordarse y GitHub puede retrasar o perder ejecuciones programadas.
name: Procesar envíos

on:
  issues:
    types: [opened, reopened, edited]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: data-writer
  queue: max

jobs:
  intake:
    # Sale enseguida con los issues normales. Esto no pasa por un shell: es seguro.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[QB:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/data-checkout
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npx tsx tools/actions/main.ts intake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QB_AUTO_MERGE: ${{ vars.QB_AUTO_MERGE }}
          QB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
