# Crea el reto diario y el semanal. Se lanza dos veces al día porque GitHub puede perder una
# ejecución programada, y es idempotente: lo que ya existe no se toca.
name: Retos programados

on:
  schedule:
    - cron: '7 0 * * *'
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-writer
  queue: max

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/data-checkout
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npx tsx tools/actions/main.ts scheduler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
